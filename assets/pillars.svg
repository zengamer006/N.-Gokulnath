<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
<defs>
<linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset="1" stop-color="#1a0b3a"/></linearGradient>
<filter id="f" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="c1"><rect x="40" y="188" width="240" height="8" rx="4"/></clipPath>
<clipPath id="c2"><rect x="340" y="188" width="240" height="8" rx="4"/></clipPath>
<clipPath id="c3"><rect x="640" y="188" width="240" height="8" rx="4"/></clipPath>
<clipPath id="c4"><rect x="940" y="188" width="240" height="8" rx="4"/></clipPath>
</defs>
<rect width="1200" height="250" fill="#05060f"/>
<g font-family="Consolas,Menlo,monospace" text-anchor="middle">
<!-- card 1 -->
<rect x="20" y="15" width="280" height="220" rx="14" fill="url(#card)" stroke="url(#n)" stroke-width="2"/>
<g transform="translate(160 80)" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#f)"><circle r="26"/><circle r="10"/><g><path d="M0 -36V-26M0 26V36M-36 0H-26M26 0H36M-25 -25L-18 -18M18 18L25 25M25 -25L18 -18M-18 18L-25 25"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></g></g>
<text x="160" y="140" font-size="20" font-weight="700" fill="#e0e7ff" letter-spacing="3">ENGINEERING</text>
<text x="160" y="164" font-size="12" fill="#a5b4fc">B.Tech EEE · Embedded · Circuits</text>
<rect x="40" y="188" width="240" height="8" rx="4" fill="#1e1b4b"/>
<g clip-path="url(#c1)"><rect x="-200" y="188" width="200" height="8" fill="url(#n)"><animate attributeName="x" values="40;60;40" dur="3s" repeatCount="indefinite"/></rect></g>
<!-- card 2 -->
<rect x="320" y="15" width="280" height="220" rx="14" fill="url(#card)" stroke="url(#n)" stroke-width="2"/>
<g transform="translate(460 80)" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#f)"><path d="M-24 22 L0 -30 L24 22 Z"/><path d="M-12 22 L0 -4 L12 22"/><circle cy="-38" r="4" fill="#a855f7"><animate attributeName="cy" values="-38;-44;-38" dur="1.6s" repeatCount="indefinite"/></circle></g>
<text x="460" y="140" font-size="20" font-weight="700" fill="#e0e7ff" letter-spacing="3">ENTREPRENEURSHIP</text>
<text x="460" y="164" font-size="12" fill="#a5b4fc">Co-Founder &amp; CEO · SGN RoboWorks</text>
<rect x="340" y="188" width="240" height="8" rx="4" fill="#1e1b4b"/>
<g clip-path="url(#c2)"><rect x="340" y="188" width="240" height="8" fill="url(#n)"><animate attributeName="width" values="120;240;120" dur="3s" repeatCount="indefinite"/></rect></g>
<!-- card 3 -->
<rect x="620" y="15" width="280" height="220" rx="14" fill="url(#card)" stroke="url(#n)" stroke-width="2"/>
<g transform="translate(760 80)" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#f)"><circle cx="-18" cy="-8" r="10"/><circle cx="18" cy="-8" r="10"/><path d="M-34 26 Q-18 6 -2 26 M2 26 Q18 6 34 26"/><circle r="3" cy="-8" fill="#fff"><animate attributeName="r" values="2;6;2" dur="1.4s" repeatCount="indefinite"/></circle></g>
<text x="760" y="140" font-size="20" font-weight="700" fill="#e0e7ff" letter-spacing="3">MENTORSHIP</text>
<text x="760" y="164" font-size="12" fill="#a5b4fc">Top 1% Topmate · 4.5/5 rating</text>
<rect x="640" y="188" width="240" height="8" rx="4" fill="#1e1b4b"/>
<g clip-path="url(#c3)"><rect x="640" y="188" width="240" height="8" fill="url(#n)"><animate attributeName="width" values="140;240;140" dur="3.4s" repeatCount="indefinite"/></rect></g>
<!-- card 4 -->
<rect x="920" y="15" width="280" height="220" rx="14" fill="url(#card)" stroke="url(#n)" stroke-width="2"/>
<g transform="translate(1060 80)" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#f)"><rect x="-22" y="-14" width="44" height="34" rx="6"/><path d="M0 -14V-30"/><circle cy="-34" r="5"/><circle cx="-9" cy="2" r="4" fill="#00e5ff" stroke="none"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle><circle cx="9" cy="2" r="4" fill="#00e5ff" stroke="none"><animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite"/></circle></g>
<text x="1060" y="140" font-size="20" font-weight="700" fill="#e0e7ff" letter-spacing="2">ROBOTICS·AI·IoT</text>
<text x="1060" y="164" font-size="12" fill="#a5b4fc">AIoT · IIoT · Autonomous systems</text>
<rect x="940" y="188" width="240" height="8" rx="4" fill="#1e1b4b"/>
<g clip-path="url(#c4)"><rect x="940" y="188" width="240" height="8" fill="url(#n)"><animate attributeName="width" values="160;240;160" dur="2.6s" repeatCount="indefinite"/></rect></g>
</g>
<text x="600" y="246" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11" letter-spacing="4" fill="#67e8f9" opacity=".8">FOUR PILLARS · ONE BALANCED SYSTEM</text>
</svg>
